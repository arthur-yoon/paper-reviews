[project]
name = "2608-24760-expconcad-experience-guided-text-to-cad"
version = "0.1.0"
description = "Simplified reference implementation of: ExpConCAD: Experience-Guided Text-to-CAD Generation from Shape Descriptions with Implicit Spatial Constraints"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
